# Headless service: no ClusterIP, used only so DNS_PING (the "kubernetes"
# JGroups stack) can resolve both pods' IPs from one DNS A-record query.
# Hot Rod traffic never goes through this Service; clients connect to
# each pod's hostPort directly.
apiVersion: v1
kind: Service
metadata:
  name: hotrod-rs-cluster-test
spec:
  clusterIP: None
  selector:
    app: hotrod-rs-cluster-test
  ports:
    - port: 11222
      targetPort: 11222
