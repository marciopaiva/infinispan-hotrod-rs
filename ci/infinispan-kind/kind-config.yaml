# kind cluster for the manual multi-node validation fixture: see setup.sh.
# Maps the two ports the cluster_* tests in tests/live_server.rs expect
# (cluster_seed_addrs()'s default) straight through to the two Infinispan
# pods' hostPort, through the single kind node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hotrod-rs-cluster-test
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 11222
        hostPort: 11222
        protocol: TCP
      - containerPort: 11322
        hostPort: 11322
        protocol: TCP
