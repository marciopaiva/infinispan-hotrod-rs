name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Start Infinispan
        run: ci/infinispan/setup.sh

      - name: Integration test
        # The cluster_* tests need a real multi-node cluster with a
        # distributed-cache (see docs/adr/0003-hash-aware-routing-scope.md);
        # the tls_* tests need a TLS-enabled server
        # (ci/infinispan-tls/setup.sh); this single-node, plain-TCP fixture
        # is neither, so both run instead as their own jobs in ci.yml
        # (cluster-test, tls-test) rather than here. This same selection
        # already runs on every push and PR too, as the live-test job in
        # ci.yml; running it again here is a release-time confidence
        # check against a freshly started server, not the only place it
        # runs.
        run: cargo test --test live_server -- --ignored --skip cluster_ --skip tls_
        env:
          INFINISPAN_ADDR: 127.0.0.1:11222
          INFINISPAN_USER: testuser
          INFINISPAN_PASS: testpass

      - name: Stop Infinispan
        if: always()
        run: ci/infinispan/teardown.sh
