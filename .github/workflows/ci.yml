name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  cluster-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start Infinispan cluster
        run: ci/infinispan-cluster/setup.sh

      - name: Cluster tests
        run: cargo test --test live_server cluster_ -- --ignored

      - name: Stop Infinispan cluster
        if: always()
        run: ci/infinispan-cluster/teardown.sh

  tls-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start TLS-enabled Infinispan
        run: ci/infinispan-tls/setup.sh

      - name: TLS tests
        run: cargo test --test live_server tls_ -- --ignored

      - name: Stop TLS-enabled Infinispan
        if: always()
        run: ci/infinispan-tls/teardown.sh
