name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run (no actual publish)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # Runs the test gate and, when triggered by a tag, confirms the tag
  # matches the crate's version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version' hotrod-protocol/Cargo.toml | head -1 | awk -F'"' '{print $2}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match hotrod-protocol version $VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches hotrod-protocol version, ok"

  publish:
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish hotrod-protocol
        shell: bash
        run: |
          set -euo pipefail

          DRY_RUN_INPUT="${{ github.event.inputs.dry_run || 'false' }}"
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            FLAGS="--locked --dry-run"
            echo "Mode: DRY RUN (no package will be published)"
          else
            FLAGS="--locked"
            echo "Mode: REAL PUBLISH to crates.io"
          fi

          OUTPUT=$(cargo publish -p hotrod-protocol $FLAGS 2>&1) && CODE=0 || CODE=$?
          echo "$OUTPUT"

          if [[ $CODE -ne 0 ]] && echo "$OUTPUT" | grep -q "already uploaded\|already exists"; then
            echo "Skipping: already published at this version"
            exit 0
          fi

          exit $CODE
