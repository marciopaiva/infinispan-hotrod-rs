[package]
name = "hotrod-protocol"
version = "0.6.0"
edition = "2021"
description = "Pure Rust client for the Infinispan/Red Hat Data Grid Hot Rod binary protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marciopaiva/infinispan-hotrod-rs"
readme = "README.md"

[features]
# Exposes a handful of pub(crate) parsers through thin pub wrappers in
# a #[doc(hidden)] module (see lib.rs's fuzz_internal), so fuzz/'s
# targets can call into them. Purely additive, the normal Cargo rule
# for any feature: the module only exists when this is on, nothing
# else in the crate is conditioned on it, so a default build (this
# off, as CI's `--all-features` run never exercises) is unaffected by
# construction, not by a check that specifically verifies it. Nothing
# outside fuzz/ should ever enable this.
fuzzing = []

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time", "sync"] }
tracing = "0.1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
rcgen = "0.14.10"
